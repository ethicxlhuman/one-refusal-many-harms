<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 825 256" font-family="Georgia,serif" font-size="12" fill="#222"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><text x="10.0" y="16.0" font-weight="bold" fill="#555">Round 1</text><text x="10.0" y="146.0" font-weight="bold" fill="#555">Round 1b</text><rect x="10" y="24" width="180" height="92" rx="8" fill="#fff" stroke="#2b5d8f" stroke-width="1.6"/><text x="100.0" y="44.0" text-anchor="middle" font-weight="bold">1. Prompt pairs</text><text x="100.0" y="62.0" text-anchor="middle" font-size="11" fill="#444">122 cyber harmful/harmless</text><text x="100.0" y="77.0" text-anchor="middle" font-size="11" fill="#444">twins, same topic words</text><text x="100.0" y="92.0" text-anchor="middle" font-size="11" fill="#444">+ 93 other-harm prompts</text><rect x="215" y="24" width="180" height="92" rx="8" fill="#fff" stroke="#2b5d8f" stroke-width="1.6"/><text x="305.0" y="44.0" text-anchor="middle" font-weight="bold">2. Measure directions</text><text x="305.0" y="62.0" text-anchor="middle" font-size="11" fill="#444">cyber vs general refusal</text><text x="305.0" y="77.0" text-anchor="middle" font-size="11" fill="#444">direction per layer</text><text x="305.0" y="92.0" text-anchor="middle" font-size="11" fill="#444">(cosine, before editing)</text><rect x="420" y="24" width="190" height="92" rx="8" fill="#fff" stroke="#2b5d8f" stroke-width="1.6"/><text x="515.0" y="44.0" text-anchor="middle" font-weight="bold">3. Heretic search</text><text x="515.0" y="62.0" text-anchor="middle" font-size="11" fill="#444">60 trials × 2 methods</text><text x="515.0" y="77.0" text-anchor="middle" font-size="11" fill="#444">min cyber refusals, keep</text><text x="515.0" y="92.0" text-anchor="middle" font-size="11" fill="#444">others, min drift (KL)</text><rect x="635" y="24" width="180" height="92" rx="8" fill="#fff" stroke="#3a8a3f" s