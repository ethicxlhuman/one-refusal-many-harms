gs)</text><line x1="305" y1="116" x2="305" y2="152" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><line x1="395" y1="200" x2="418" y2="200" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><line x1="610" y1="200" x2="633" y2="200" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/></svg>