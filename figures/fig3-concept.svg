<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" font-family="Georgia,serif" font-size="12" fill="#222"><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><line x1="70" y1="210" x2="330" y2="210" stroke="#8c8c8c" stroke-width="3" stroke-dasharray="" marker-end="url(#b)"/><text x="150.0" y="232.0" fill="#8c8c8c" font-weight="bold">general refusal direction (shared by all harms)</text><line x1="70" y1="210" x2="300" y2="60" stroke="#2b5d8f" stroke-width="3" stroke-dasharray="" marker-end="url(#b)"/><text x="310.0" y="58.0" fill="#2b5d8f" font-weight="bold">cyber refusal direction</text><line x1="300" y1="210" x2="300" y2="68" stroke="#3a8a3f" stroke-width="2" stroke-dasharray="5 4"/><line x1="70" y1="210" x2="70" y2="70" stroke="#3a8a3f" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#b)"/><text x="80.0" y="64.0" fill="#3a8a3f" font-weight="bold">cyber-only part (round 1b)</text><text x="108.0" y="200.0" font-size="11" fill="#2b5d8f">cos ≈ 0.67–0.86</text><text x="318.0" y="150.0" font-size="11" fill="#8c8c8c">= shared part</text><text x="318.0" y="166.0" font-size="11" fill="#3a8a3f">+ cyber-only part</text><text x="470.0" y="70.0" font-size="12">ARA: removes much of the shared part</text><text x="470.0" y="86.0" font-size="12" fill="#d4691e">→ cyber unlocked, bio/chem leaks</text><text x="470.0" y="118.0" font-size="12">Abliteration: removes a little of it</text><text x="470.0" y="134.0" font-size="12" fill="#2b5d8f">→ little leakage, half of cyber unlocked</text><text x="470.0" y="166.0" font-size="12">Cyber-only part removed (×1–×3)</text><text x="470.0" y="182.0" font-size="12" fill="#3a8a3f">→ almost nothing changes</text></svg>